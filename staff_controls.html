<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sensory Room - Staff Controls</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="main_styles.css">
</head>
<body class="main-body staff-controls">
    <h1>Sensory Admin Logs</h1>
    <h4>Time Remaining: <output id="timeLimit">--:--</output></h4>
    <p id="auditLogStatus" role="status"></p>
    <div class="table-responsive audit-log-container">
        <table class="table table-dark table-striped">
            <thead>
                <tr>
                    <th scope="col">Time</th>
                    <th scope="col">Control</th>
                    <th scope="col">Value</th>
                </tr>
            </thead>
            <tbody id="auditLogList"></tbody>
        </table>
    </div>
    <button type="button" id="terminateSession" class="menu-button terminate-session-button">Terminate Session</button>
    <a href="patient_sensory_controls.html" class="menu-button return-to-patient-button">Return to Personalisation Controls</a>
    <script src="sensory_controls.js"></script>
</body>
</html>
