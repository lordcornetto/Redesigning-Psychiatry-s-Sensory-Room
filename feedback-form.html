<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="main_styles.css">
</head>
<body>
    <h1>Feedback Form</h1>
    <h3>We would like you to share your feedback to help us improve our system, as well as improving your experience.</h3>
    <div class="feedback-form">
        <div class="form-group">
            <label for="name">Provide your full name:</label>
            <input type="text" class="form-control" id="name" name="name" required>
        </div>
        <br>
        <label for="experienceTypeLiked">What did you like about this experience?</label><br>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="roomLighting">
            <label for="experienceTypeLiked">Room Lighting</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="noise">
            <label for="experienceTypeLiked">Noise</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="blackoutBlinds">
            <label for="experienceTypeLiked">Blackout Blinds</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="massagingPressures">
            <label for="experienceTypeLiked">Massaging Pressures</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="bubbleTube">
            <label for="experienceTypeLiked">Bubble Tube</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="comfortableFurniture">
            <label for="experienceTypeLiked">Comfortable Furniture</label>
        </div>
        <div class="form-check">
            <input type="checkbox" class="form-check-input" id="experienceTypeLiked" name="experienceTypeLiked" value="music">
            <label for="experienceTypeLiked">Music</label>
        </div>
        <div class="form-group">
            <label for="nextSessionSuggestions">What sensory experience would you like in the next session?</label>
            <input type="text" class="form-control" id="nextSessionSuggestions" name="nextSessionSuggestions">
        </div>
        <label for="experienceRating" id="experience-rating-scale" class="form-label">Rate your overall experience:</label>
        <br>
        <output id="experienceRatingValue">5</output>
        <br>
        <input type="range" class="form-range" min="0" max="10" step="1" id="experienceRating" name="experienceRating" oninput="document.getElementById('experienceRatingValue').value = this.value">
        <input type="submit" value="Submit"> 
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
</body>
</html>
